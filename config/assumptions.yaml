# Phase 6 asset values (proposal Step 3; Decision 25). Every value has a row with its source in
# docs/assumptions.md ("Phase 6 asset values").

# Sensitivity grid from the proposal (Step 3).
grid:
  discount_rate: [0.08, 0.10, 0.12]
  utilization: [0.50, 0.70, 0.90]
  pue: [1.2, 1.4]

# Base case: the project's shared defaults (docs/assumptions.md "Shared").
base:
  discount_rate: 0.10        # midpoint of the proposal grid (P2/P3 use 8%)
  utilization: 0.70
  pue: 1.3
  electricity_usd_per_kwh: 0.089   # EIA Form 861M, US industrial, last 12 months (Decision 12)
  maintenance_share_of_capex: 0.04 # per year (Decision 11)
  failure_rate_per_year: 0.02      # constant hazard, permanent loss (Decision 12)
  power_basis: system_max          # system_max | tdp

failure_rate_sensitivity: [0.005, 0.02, 0.111]

# Horizon: no rent beyond the oldest age observed in the panel (V100, about 9 years).
horizon_years: 9.0
horizon_sensitivity: [6.0, 5.0]
step_months: 1

# Valuation date and the rent level each chip's path is anchored to: the M4 snapshot's neocloud
# median on-demand price (paper/tables/m4_spot_medians.csv; Decision 13), USD per GPU-hour.
valuation_date: "2026-11-11"
rent_anchor: median_neocloud      # median_neocloud | median_all

chips:
  a100_80gb:
    # DGX A100: "6.5 kW max." / 8 GPUs (docs.nvidia.com DGX A100 user guide; scope caveat logged)
    system_power_kw_per_gpu: 0.8125
    capex_usd: 15000.0            # A100 40GB card (Epoch); no Epoch price for the 80GB; lower bound
    capex_basis: "A100 40GB card price (Epoch), lower bound for the 80GB"
  h100_sxm:
    system_power_kw_per_gpu: 1.275  # DGX H100: "10.2 kW max." / 8
    capex_usd: 33600.0              # Epoch / SemiAnalysis DGX H100 $269k / 8 (Decision 10)
    capex_basis: "DGX H100 $269k / 8 (Epoch, citing SemiAnalysis)"
  h200:
    system_power_kw_per_gpu: 1.275  # DGX H100/H200 user guide gives only the 10.2 kW figure
    capex_usd: 30000.0              # Epoch release price
    capex_basis: "Epoch release price"
  b200:
    system_power_kw_per_gpu: 1.7875 # DGX B200: "~14.3 kW max" / 8
    capex_usd: 54656.0              # 33,600 x 1.6267 per-generation growth (p3_capex.json); derived
    capex_basis: "H100 capex x Epoch per-generation growth 1.63 (derived, Decision 10)"

# Rent paths (log rent relative to age 0). "realized_older" chain-links the observed cohort paths
# of the V100, A100 40GB and A100 80GB (p5_cohort_paths.csv); strategy profiles come from
# p5_profiles.csv and p5_strategy4_sweep.csv (to age 6) and borrow realized_older's increments
# beyond age 6. The borrowing rule is switchable: realized_older | v100 | flat.
borrow_beyond_age6: realized_older
older_chips: [v100, a100_40gb, a100_80gb]
s4_deltas: [0.0, -0.10, -0.20, -0.30, -0.40]

# Schedules handed to the Phase 7 restatement (paper/tables/p6_schedules.csv), base case.
schedule_chip: h100_sxm
schedule_profiles: [realized_older, s2_frontier, s4_d-0.20, s4_d-0.40]
