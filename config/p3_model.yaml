# P3 retirement model parameters. docs/handoff_extension.md section 5, Decisions 8 and 9.
# Every value is logged in docs/assumptions.md with its source. Three kinds of value:
#   measured     - from P1 via data/processed/p3_calibration.json (gel.models.p3_calibration)
#   handoff      - specified in the owner's handoff
#   placeholder  - chosen by Claude Code, awaiting owner sign-off; varied in sensitivity runs
# `null` means NO SOURCE YET. The model refuses to run until it is filled (CLAUDE.md rule 1).

seed: 20261110
n_paths: 20000            # handoff
horizon_months: 180       # handoff
launch_window_months: 60  # handoff: track generations launched in months 0-60
hold_months: 3            # handoff: condition must hold 3 consecutive months

market:
  utilization: 0.70            # handoff default
  pue: 1.3                     # handoff default
  discount_rate_annual: 0.08   # handoff default (neocloud cost of capital)
  annuity_months: 60           # placeholder: n in A = K r / (1 - (1+r)^-n); handoff gives none

hardware:
  calibration_file: data/processed/p3_calibration.json
  comparison: best_available   # Decision 9; alternative: bf16
  generation0: H100_SXM        # Decision 10: re-anchored on the H100 (sourced all-in capex)
  sigma_G: 0.15                # placeholder: one measured architecture step cannot identify it
  power_step: from_calibration # measured A100 -> H100 board-power ratio
  mu_G: from_calibration       # measured log(eta_H100 / eta_A100)

capex:                         # Decision 10, from data/processed/p3_capex.json (gel.models.p3_capex)
  source_file: data/processed/p3_capex.json
  K0_usd: from_epoch           # $33,600: Epoch AI, H100 SXM5 DGX $269k / 8 (server share included)
  growth_per_generation: from_epoch  # 1.63x: H100 GPU+baseboard BOM / A100 40GB card price
maintenance_fraction_of_capex_per_year: 0.04  # Decision 11: CloudRift (2026-01-21) 'spares' 4% of capex/yr; M_g = 0.04 K_g / 12

cadence:                       # months between frontier launches
  months: [18, 24, 30, 36]     # handoff support
  probs:  [0.25, 0.50, 0.25, 0.0]  # placeholder: mean 24 months, matching the base scenario

markup:                        # scarcity markup m(t), OU, annual parameters
  mean: 0.20                   # placeholder
  kappa: 1.0                   # placeholder (half-life ~8 months)
  sigma: 0.30                  # placeholder
  x0: 0.20                     # placeholder: start at the mean
  floor: -0.5                  # handoff

electricity:                   # e(t), $/kWh, OU
  mean: 0.08                   # handoff default (owner's open question 3: region vs national)
  kappa: 1.0                   # placeholder
  sigma: 0.02                  # placeholder
  x0: 0.08
  floor: 0.02                  # handoff

regime:                        # monthly Markov chain; True = power-constrained
  p_stay_constrained: 0.97     # placeholder
  p_stay_unconstrained: 0.97   # placeholder
  start_constrained: true      # placeholder (2026 power scarcity)

failure:                       # Weibull physical failure
  scale_years: 8.0             # handoff
  shape: 1.5                   # handoff

scenarios:                     # overrides of the base parameters (handoff 5.3)
  base: {}
  fast_frontier: {cadence: {months: [18], probs: [1.0]}}
  slow_frontier: {cadence: {months: [36], probs: [1.0]}}
  always_constrained: {regime: {p_stay_constrained: 1.0, p_stay_unconstrained: 0.0, start_constrained: true}}
  power_abundant: {regime: {p_stay_constrained: 0.0, p_stay_unconstrained: 1.0, start_constrained: false}}
  scarcity_boom: {markup: {mean: 1.0, x0: 1.0}}   # placeholder: "2026-like" high markup
  empirical_cadence: {cadence: {months: [26, 28, 34], probs: [0.3333, 0.3333, 0.3334]}}  # Epoch release gaps V100->A100->H100->B200
  capex_low: {capex: {K0_usd: 24400.0}}            # sensitivity: H100 GPU + baseboard only (Epoch note)
  capex_flat: {capex: {growth_per_generation: 1.0}}  # sensitivity: flat capex per generation
  maintenance_high: {maintenance_fraction_of_capex_per_year: 0.125}  # sensitivity: GMI Cloud 10-15% midpoint
