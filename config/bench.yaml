# P1 benchmark specification. docs/handoff_extension.md section 3.2, as amended by Decision 6.
# Identical on every GPU. Any deviation on a pod is recorded in run_meta.json as a confound.

# One model for all GPUs. Owner's open question 1: switching to the Qwen fallback applies to
# every GPU, never to some of them.
model: meta-llama/Llama-3.1-8B-Instruct   # gated: needs HF_TOKEN with access granted
model_fallback: Qwen/Qwen2.5-7B-Instruct  # ungated
download_exclude: ["original/*"]          # Llama ships duplicate consolidated weights there

vllm_version: "0.32.0"                     # image vllm/vllm-openai:v0.32.0 (2026-10-18)

serve:
  dtype: bfloat16
  max_model_len: 4096          # must fit a 24GB 4090 with KV cache
  gpu_memory_utilization: 0.90
  prefix_caching: false        # --no-enable-prefix-caching
  seed: 42
  port: 8000
  health_timeout_s: 900        # model load + CUDA graph capture; first FP8 load is slow

workload:
  dataset: random
  input_len: 512
  output_len: 256              # the random dataset sets ignore_eos, so every request emits 256
  seed: 42
  concurrency: [1, 8, 32, 128]
  # Decision 6: 20xC at C<=8, 5xC from C=32 (never under 160 requests above C=1).
  prompts: {1: 20, 8: 160, 32: 160, 128: 640}
  repeats: 3
  warmup_prompts: 32           # one discarded run per precision mode
  warmup_concurrency: 32
  idle_after_mode_s: 10        # server stopped; power returns to idle; window logged

power:
  interval_ms: 1000
  max_gap_s: 2.5               # a window with a longer gap between samples is flagged

# precision mode -> vLLM serve flags. fp8_weight_only and fp8 run the same flag; the label
# records what the hardware actually does (Marlin W8A16 on Ampere, native W8A8 on Ada/Hopper+).
modes:
  bf16: []
  fp8: ["--quantization", "fp8"]
  fp8_weight_only: ["--quantization", "fp8"]

# GPU_LABEL (first argument to run_all.sh) -> chip id and modes. Chip ids follow CLAUDE.md;
# rtx4090 is a smoke-test card outside the paper's sample.
gpus:
  RTX4090:    {chip_id: rtx4090,   arch: ada,       modes: [bf16, fp8]}
  A100_SXM:   {chip_id: a100_80gb, arch: ampere,    modes: [bf16, fp8_weight_only]}
  H100_SXM:   {chip_id: h100_sxm,  arch: hopper,    modes: [bf16, fp8]}
  L40S:       {chip_id: l40s,      arch: ada,       modes: [bf16, fp8]}
  H200_SXM:   {chip_id: h200,      arch: hopper,    modes: [bf16, fp8]}
  B200:       {chip_id: b200,      arch: blackwell, modes: [bf16, fp8]}
  CPU_STUB:   {chip_id: stub,      arch: stub,      modes: [bf16, fp8]}   # dry runs only

# Owner-cost defaults for energy cost per token (handoff 3.5); both get a sensitivity sweep.
# Owner's open question 3 (region vs national average) is unresolved.
energy_cost:
  electricity_usd_per_kwh: 0.08
  pue: 1.3
