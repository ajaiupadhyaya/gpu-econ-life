[project]
name = "gel"
version = "0.1.0"
description = "Market-implied economic life of AI accelerators: data pipeline and models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.0",
    "httpx>=0.27",
    "linearmodels>=6.0",
    "matplotlib>=3.9",
    "polars>=1.0",
    "pyarrow>=16",
    "pyfixest>=0.25",
    "pyyaml>=6.0",
    "selectolax>=0.3",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
